<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Notas Escolar</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Vista: Login -->
    <section id="vista-login" class="vista">
        <div class="login-card">
            <h1>Control de Notas</h1>
            <p class="subtitulo">Acceso para profesores</p>

            <form id="form-login">
                <div class="campo">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" required autocomplete="username">
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <p id="login-error" class="mensaje-error oculto"></p>

                <button type="submit">Ingresar</button>
            </form>
        </div>
    </section>

    <!-- Vista Dashboard -->
    <section id="vista-dashboard" class="vista oculto">
        <header class="topbar">
            <h2>Control de Notas</h2>
            <div class="topbar-info">
                <span id="nombre-profesor-activo"></span>
                <button id="btn-logout" class="btn-secundario">Cerrar sesión</button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-btn activo" data-tab="estudiantes">Estudiantes</button>
            <button class="tab-btn" data-tab="cursos">Cursos</button>
            <button class="tab-btn" data-tab="profesores">Profesores</button>
        </nav>

        <main class="contenido">

            <!-- Tab: Estudiantes -->
            <div id="tab-estudiantes" class="tab-panel">
                <div class="panel-header">
                    <h3>Estudiantes</h3>
                    <button id="btn-nuevo-estudiante" class="btn-primario">+ Nuevo estudiante</button>
                </div>
                <div id="grid-estudiantes" class="grid-tarjetas">
                    <!-- Tarjetas generadas dinámicamente por JS -->
                </div>
            </div>

            <!-- Tab: Cursos -->
            <div id="tab-cursos" class="tab-panel oculto">
                <div class="panel-header">
                    <h3>Cursos</h3>
                    <button id="btn-nuevo-curso" class="btn-primario">+ Nuevo curso</button>
                </div>
                <div id="grid-cursos" class="grid-tarjetas">
                    <!-- Tarjetas generadas dinámicamente por JS -->
                </div>
            </div>

            <!-- Tab: Profesores -->
            <div id="tab-profesores" class="tab-panel oculto">
                <div class="panel-header">
                    <h3>Profesores</h3>
                    <button id="btn-nuevo-profesor" class="btn-primario">+ Nuevo profesor</button>
                </div>
                <div id="grid-profesores" class="grid-tarjetas">
                    <!-- Tarjetas generadas dinámicamente por JS -->
                </div>
            </div>

        </main>
    </section>

    <!-- Modal para los formularios -->
    <div id="modal-overlay" class="modal-overlay oculto">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-titulo">Título</h3>
                <button id="modal-cerrar" class="btn-cerrar">&times;</button>
            </div>
            <div id="modal-contenido"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/tabs.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/estudiantes.js"></script>
    <script src="js/cursos.js"></script>
    <script src="js/profesores.js"></script>
    <script src="js/detalle-estudiante.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
